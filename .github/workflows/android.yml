name: Android release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager" ]] || sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.${GITHUB_RUN_NUMBER}"
          echo "NUR_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "NUR_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUR_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::Добавьте секрет NUR_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nur-release.jks"
          echo "NUR_KEYSTORE=$RUNNER_TEMP/nur-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          NUR_KEYSTORE_PASSWORD: ${{ secrets.NUR_KEYSTORE_PASSWORD }}
          NUR_KEY_ALIAS: nur
          NUR_DEFAULT_SERVER: ${{ vars.NUR_DEFAULT_SERVER }}
          NUR_FCM_APP_ID: ${{ vars.NUR_FCM_APP_ID }}
          NUR_FCM_API_KEY: ${{ vars.NUR_FCM_API_KEY }}
          NUR_FCM_PROJECT_ID: ${{ vars.NUR_FCM_PROJECT_ID }}
          NUR_FCM_SENDER_ID: ${{ vars.NUR_FCM_SENDER_ID }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease lintRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Nur-$NUR_VERSION_NAME.apk"
          sha256sum "$GITHUB_WORKSPACE/Nur-$NUR_VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Nur-${{ env.NUR_VERSION_NAME }}
          path: Nur-*.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: Nur-*.apk
          generate_release_notes: true
